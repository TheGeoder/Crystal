name: Build Crystal Packages (All Platforms)

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Crystal Injection Libraries"]
    types:
      - completed

jobs:
  crystal-android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Crystal Android 64-bit
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/android64.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          mkdir -p dist
          cp build/libcrystal.so dist/
          cp build/libinject.so dist/
          cp -r styles resources dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Crystal-Android64
          path: dist/

  crystal-android32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Crystal Android 32-bit
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/android32.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          mkdir -p dist
          cp build/libcrystal.so dist/
          cp build/libinject.so dist/
          cp -r styles resources dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Crystal-Android32
          path: dist/

  crystal-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Crystal Windows (x64)
        run: |
          cmake -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/windows.toolchain.cmake
          cmake --build build --config Release
          mkdir dist
          copy build\Release\CrystalCore.dll dist\
          copy build\Release\XInput9_1_0.dll dist\
          xcopy /E /I styles dist\styles
          xcopy /E /I resources dist\resources
      - uses: actions/upload-artifact@v4
        with:
          name: Crystal-Windows
          path: dist/

  crystal-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Crystal macOS (.app bundle)
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/macos.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          mkdir -p "Crystal.app/Contents/MacOS"
          mkdir -p "Crystal.app/Contents/Resources"
          cp build/libCrystalCore.dylib "Crystal.app/Contents/MacOS/"
          cp build/libinject.dylib "Crystal.app/Contents/MacOS/"
          cp -r styles resources "Crystal.app/Contents/Resources/"
          zip -r Crystal-macOS.app.zip Crystal.app
      - uses: actions/upload-artifact@v4
        with:
          name: Crystal-macOS-App
          path: Crystal-macOS.app.zip

  crystal-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Crystal iOS (.ipa package)
        run: |
          cmake -B build -G Xcode -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ios.toolchain.cmake
          cmake --build build --config Release
          mkdir -p Payload/Crystal.app/Frameworks
          cp build/Release-iphoneos/libCrystalCore.dylib Payload/Crystal.app/Frameworks/
          cp build/Release-iphoneos/libinject.dylib Payload/Crystal.app/Frameworks/
          cp -r styles resources Payload/Crystal.app/
          zip -r Crystal-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Crystal-iOS-IPA
          path: Crystal-iOS.ipa
